<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d1b" />
  <title>Homer's Portfolio</title>
  <style>
    :root {
      --bg: #080d1b;
      --panel: rgba(16, 25, 48, .74);
      --text: #f3f7ff;
      --muted: #a6b3cb;
      --cyan: #52e5ff;
      --purple: #a78bfa;
      --line: rgba(125, 164, 220, .19);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(3,7,18,.78), rgba(3,7,18,.58) 45%, rgba(3,7,18,.92)),
        url('tech_background.png') center / cover fixed no-repeat,
        #050916;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
      background-image: linear-gradient(rgba(112, 150, 210, .055) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(112, 150, 210, .055) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 94%);
      animation: gridDrift 28s linear infinite;
    }
    body::after {
      content: ""; position: fixed; inset: -30%; pointer-events: none; z-index: -2;
      background: radial-gradient(ellipse at 18% 28%, rgba(0, 195, 255, .19), transparent 34%),
                  radial-gradient(ellipse at 78% 36%, rgba(142, 43, 255, .20), transparent 32%),
                  radial-gradient(ellipse at 55% 90%, rgba(0, 90, 255, .14), transparent 35%);
      filter: blur(20px); animation: auroraFlow 18s ease-in-out infinite alternate;
    }
    #particles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .topbar, .layout, footer { position: relative; z-index: 1; }
    a { color: inherit; text-decoration: none; }
    .topbar {
      width: 100%; margin: 0; padding: 14px clamp(16px, 2.5vw, 36px);
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .top-links { display: flex; align-items: center; gap: 22px; }
    .top-links a {
      padding: 6px 0; border: 0; border-bottom: 1px solid transparent; border-radius: 0;
      color: var(--muted); font-size: .78rem; font-weight: 650;
      transition: color .2s, border-color .2s, background .2s;
    }
    .top-links a:hover { color: var(--cyan); border-bottom-color: var(--cyan); background: transparent; }
    .brand { font-weight: 800; letter-spacing: .08em; font-size: .95rem; }
    .brand span { color: var(--cyan); }
    .status { color: var(--muted); font-size: .78rem; display: flex; align-items: center; gap: 9px; }
    .status::before { content: ""; width: 7px; height: 7px; background: #63f5b4; border-radius: 50%; box-shadow: 0 0 12px #63f5b4; }
    .layout { width: 100%; margin: 0 auto 0; padding: 0; }
    .hero {
      min-height: calc(100vh - 58px); width: 100%; display: grid; grid-template-columns: 1.15fr .85fr; align-items: center;
      gap: 12px; padding: clamp(18px, 2.5vw, 36px); position: relative; overflow: hidden;
      border: 0; border-radius: 0;
      background: linear-gradient(110deg, rgba(4, 10, 27, .80), rgba(7, 13, 31, .42)), url('tech_background.png') center / cover;
      box-shadow: 0 30px 100px rgba(0,0,0,.50), 0 0 55px rgba(40,110,255,.10), inset 0 1px 0 rgba(255,255,255,.07); backdrop-filter: blur(3px);
      animation: rise .8s ease both;
      isolation: isolate;
    }
    .hero::before {
      content: ""; position: absolute; inset: -60% -20%; z-index: -1; pointer-events: none;
      background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0,220,255,.07) 45deg, transparent 95deg, rgba(157,65,255,.10) 180deg, transparent 250deg, rgba(0,220,255,.07) 320deg, transparent 360deg);
      animation: auroraSpin 34s linear infinite;
    }
    .hero::after {
      content: ""; position: absolute; width: 340px; height: 340px; right: -170px; top: -170px;
      border: 1px solid rgba(82,229,255,.24); border-radius: 50%;
      box-shadow: 0 0 0 35px rgba(82,229,255,.035), 0 0 0 70px rgba(82,229,255,.025), 0 0 45px rgba(82,229,255,.12);
      pointer-events: none; animation: ringPulse 7s ease-in-out infinite;
    }
    .eyebrow { color: var(--cyan); text-transform: uppercase; letter-spacing: .22em; font-size: .72rem; font-weight: 800; }
    h1 { font-size: clamp(2.8rem, 5.5vw, 5rem); line-height: 1.08; letter-spacing: -.015em; margin: 20px 0 18px; }
    h1 .first-name { display: block; color: var(--text); }
    h1 .last-name { display: block; background: linear-gradient(90deg, var(--cyan), #b9a4ff 75%); color: transparent; background-clip: text; }
    .subtitle { color: var(--muted); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.7; margin: 0 0 30px; }
    .subtitle strong { color: #eaf2ff; font-weight: 650; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer;
      padding: 13px 18px; border: 1px solid var(--line); border-radius: 12px; color: var(--text);
      background: rgba(255,255,255,.035); font: inherit; font-weight: 700; font-size: .9rem;
      transition: transform .2s, border-color .2s, background .2s;
    }
    .button:hover { transform: translateY(-3px); border-color: rgba(82,229,255,.65); background: rgba(82,229,255,.08); }
    .button.primary { color: #07111f; background: linear-gradient(100deg, var(--cyan), #b5a2ff); border: 0; }
    .profile-wrap { display: grid; place-items: center; position: relative; grid-column: 1; grid-row: 1; }
    .hero-copy { grid-column: 2; grid-row: 1; }
    .orbit { width: min(720px, 56vw); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .orbit::before, .orbit::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(82,229,255,.35); animation: spin 18s linear infinite; }
    .orbit::after { inset: 17px -14px; border-color: rgba(167,139,250,.4); transform: rotate(48deg); animation-duration: 24s; animation-direction: reverse; }
    .orbit-dot { position: absolute; top: 22px; right: 30px; width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }
    .avatar {
      width: 88%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; position: relative;
      display: grid; place-items: center; border: 2px solid rgba(82,229,255,.78);
      background: linear-gradient(145deg, #17294a, #101326);
      box-shadow: 0 0 35px rgba(35,130,255,.38), 0 0 75px rgba(35,130,255,.24), 0 0 130px rgba(151,54,255,.22), inset 0 0 24px rgba(82,229,255,.12);
      animation: portraitFloat 6s ease-in-out infinite;
    }
    .avatar::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(145deg, rgba(95,220,255,.12), transparent 38%, transparent 70%, rgba(166,93,255,.18));
      box-shadow: inset 0 0 30px rgba(0,0,0,.24); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; filter: brightness(1.10) contrast(1.06) saturate(1.08) drop-shadow(0 0 12px rgba(55,190,255,.12)); display: block; transform: scale(1.025); }
    .avatar.has-image img { display: block; }
    .avatar.has-image .placeholder { display: none; }
    .placeholder { text-align: center; color: var(--muted); padding: 20px; }
    .placeholder .monogram { font-size: 5rem; line-height: 1; font-weight: 900; letter-spacing: -.08em; color: var(--cyan); }
    .placeholder small { display: block; margin-top: 12px; font-size: .72rem; line-height: 1.5; }
    .edit-photo {
      position: absolute; z-index: 2; bottom: 8px; right: 0; padding: 11px 14px; border-radius: 12px;
      background: #111c35; border: 1px solid rgba(82,229,255,.45); font-size: .78rem; font-weight: 750;
      cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,.28); transition: transform .2s;
    }
    .edit-photo:hover { transform: translateY(-3px); }
    #photoInput { display: none; }
    .nav-section { display: none; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 2px 16px; }
    .section-heading h2 { margin: 0; font-size: 1.2rem; letter-spacing: -.025em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: .82rem; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .nav-card {
      min-height: 155px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between;
      border: 1px solid var(--line); border-radius: 18px; background: var(--panel);
      transition: transform .25s, border-color .25s, background .25s; position: relative; overflow: hidden;
    }
    .nav-card:hover { transform: translateY(-5px); border-color: rgba(82,229,255,.5); background: rgba(23, 36, 67, .9); }
    .nav-card .icon { font-size: 1.4rem; color: var(--cyan); }
    .nav-card h3 { margin: 13px 0 5px; font-size: 1rem; }
    .nav-card p { margin: 0; color: var(--muted); font-size: .78rem; }
    .arrow { position: absolute; top: 21px; right: 22px; color: var(--muted); transition: transform .2s, color .2s; }
    .nav-card:hover .arrow { transform: translate(3px,-3px); color: var(--cyan); }
    footer { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 0 0 30px; display: flex; justify-content: space-between; gap: 15px; color: #75839f; font-size: .75rem; }
    .toast {
      position: fixed; inset: auto 20px 24px; margin: auto; width: fit-content; max-width: calc(100% - 40px);
      padding: 16px 20px; border: 1px solid rgba(82,229,255,.4); border-radius: 14px;
      background: #111c35; box-shadow: 0 15px 50px rgba(0,0,0,.4); color: var(--text);
      opacity: 0; transform: translateY(20px); pointer-events: none; transition: .25s; z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast strong { color: var(--cyan); }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes auroraFlow { 0% { transform: translate3d(-2%, -1%, 0) rotate(0deg) scale(1); } 100% { transform: translate3d(2%, 2%, 0) rotate(8deg) scale(1.08); } }
    @keyframes auroraSpin { to { transform: rotate(360deg); } }
    @keyframes gridDrift { to { background-position: 46px 46px; } }
    @keyframes ringPulse { 0%,100% { opacity: .68; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
    @keyframes portraitFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
    @media (max-width: 760px) {
      .topbar { padding: 16px 0; flex-wrap: wrap; }
      .top-links { order: 3; width: 100%; justify-content: space-between; gap: 10px; }
      .top-links a { padding: 7px 0; font-size: .7rem; }
      .status { font-size: .72rem; }
      .layout { margin-top: 16px; }
      .hero { min-height: calc(100vh - 58px); grid-template-columns: 1fr; gap: 22px; text-align: center; padding: 24px 14px; }
      .actions { justify-content: center; }
      .profile-wrap { grid-column: 1; grid-row: 1; }
      .orbit { width: min(430px, 82vw); }
      .hero-copy { grid-column: 1; grid-row: 2; }

      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* Intro typewriter animation */
    .hero-copy .eyebrow,
    .hero-copy .first-name,
    .hero-copy .last-name { display: block; min-height: 1em; letter-spacing: 0; }
    .hero-copy .typing-caret::after {
      content: ""; display: inline-block; width: 2px; height: .9em;
      margin-left: 5px; vertical-align: -.05em;
      background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
      animation: caretBlink .75s steps(1) infinite;
    }
    .hero-copy .subtitle { opacity: 0; transform: translateY(8px); transition: opacity .55s ease, transform .55s ease; }
    .hero-copy .subtitle.intro-visible { opacity: 1; transform: translateY(0); }
    @keyframes caretBlink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .hero-copy .typing-caret::after { animation: none; }
      .hero-copy .subtitle { transition: none; }
    }

  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerHTML = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    document.querySelectorAll('[data-page]').forEach(card => {
      card.addEventListener('click', (event) => {
        event.preventDefault();
        const page = card.dataset.page;
        showToast('<strong>404 — Still in development.</strong><br>' + page + ' page is coming soon!');
        history.replaceState(null, '', '#' + page.toLowerCase().replaceAll(' ', '-'));
      });
    });

    // Subtle animated background particles; kept lightweight for mobile.
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let dots = [];
    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const count = Math.min(55, Math.floor(window.innerWidth / 24));
      dots = Array.from({length: count}, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - .5) * .28,
        vy: (Math.random() - .5) * .28,
        r: Math.random() * 1.5 + .5
      }));
    }
    function animateParticles() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = 0; i < dots.length; i++) {
        const p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > window.innerWidth) p.vx *= -1;
        if (p.y < 0 || p.y > window.innerHeight) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(113, 205, 255, .55)'; ctx.fill();
        for (let j = i + 1; j < dots.length; j++) {
          const q = dots[j], dx = p.x - q.x, dy = p.y - q.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 115) {
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = `rgba(93, 161, 235, ${.12 * (1 - distance / 115)})`;
            ctx.lineWidth = .7; ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateParticles);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateParticles();

    // Type the intro when the homepage opens.
    (function typeIntroOnLoad() {
      const eyebrow = document.querySelector('.hero-copy .eyebrow');
      const firstName = document.querySelector('.hero-copy .first-name');
      const lastName = document.querySelector('.hero-copy .last-name');
      const subtitle = document.querySelector('.hero-copy .subtitle');
      if (!eyebrow || !firstName || !lastName || !subtitle) return;
      const lines = [
        { el: eyebrow, text: eyebrow.textContent.trim(), speed: 34 },
        { el: firstName, text: firstName.textContent.trim(), speed: 90 },
        { el: lastName, text: lastName.textContent.trim(), speed: 90 }
      ];
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) {
        subtitle.classList.add('intro-visible');
        return;
      }
      lines.forEach(line => { line.el.textContent = ''; });
      let lineIndex = 0;
      function typeNextLine() {
        if (lineIndex >= lines.length) {
          subtitle.classList.add('intro-visible');
          return;
        }
        const line = lines[lineIndex];
        line.el.classList.add('typing-caret');
        let charIndex = 0;
        function typeChar() {
          line.el.textContent = line.text.slice(0, ++charIndex);
          if (charIndex < line.text.length) {
            setTimeout(typeChar, line.speed);
          } else {
            line.el.classList.remove('typing-caret');
            lineIndex++;
            setTimeout(typeNextLine, 180);
          }
        }
        typeChar();
      }
      typeNextLine();
    })();
  </script>
